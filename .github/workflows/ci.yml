name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  VSTEST_CONNECTION_TIMEOUT: '600'

jobs:
  portable:
    name: Portable layer (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    # The App tests (tests/BestFit/RMC.BestFit.App.Tests) take most of this, the macOS runner longest:
    # 120 minutes until they're made lighter.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # rids: the HEC-DSS natives built on this runner (osx-x64 is cross-built on Apple silicon).
          - { name: windows-x64, os: windows-latest, rids: win-x64 }
          - { name: macos-arm64, os: macos-latest, rids: osx-arm64 osx-x64 }
          - { name: linux-x64, os: ubuntu-latest, rids: linux-x64 }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # BestFit's example projects, and HEC's sample DSS files for the HEC-DSS tests.
      - name: Fetch sample data
        shell: bash
        run: bash scripts/fetch-sample-data.sh RMC-BestFit dss-test-data

      # The native hecdss library from upstream/hec-dss (CMake, C only, no downloads), then HEC's C
      # tests with CTest. The osx-x64 tests run under Rosetta 2 when the runner has it.
      - name: Build HEC-DSS natives and run HEC's C tests
        shell: bash
        run: bash native/build-hecdss.sh --test ${{ matrix.rids }}

      # Everything needed to build is in the repository: no downloads besides NuGet packages.
      - name: Build from a fresh checkout
        run: dotnet build XGoodFit.slnx -c Release

      # The ported UI's own tests, run headlessly, and the HEC-DSS wrapper's tests, which must find
      # the natives and the sample data here. The application's view tests run in the next step.
      - name: XGoodFit tests
        run: dotnet test XGoodFit.slnx -c Release --no-build -p:XGoodFitAppTestsInScript=true
        env:
          XGOODFIT_REQUIRE_HECDSS: '1'

      # The application's view tests (RMC.BestFit.App.Tests), each of XGoodFit's test classes in its
      # own process: in one process they need more memory than the runners have.
      - name: App tests
        if: ${{ !cancelled() }}
        shell: bash
        run: bash scripts/run-app-tests.sh Release

      # The tests above include the file-compatibility suite (tests/BestFit/RMC.BestFit.FileCompat.Tests):
      # every example opened and saved by the port, compared with what upstream's WPF RMC-BestFit saves.
      # This shows what it found here, including the platform differences it accepts outside Windows.
      - name: File-compatibility summary
        if: always()
        shell: bash
        run: cat artifacts/filecompat/*/summary.txt 2>/dev/null || echo "No file-compatibility summary was written."

      # Windows only: upstream's own WPF RMC-BestFit opens and saves the examples again, and must write
      # exactly the golden data the suite compares the port with (Golden/README.md in its tests).
      - name: WPF reference matches the golden data
        if: runner.os == 'Windows'
        shell: bash
        run: |
          dotnet run -c Release --project tools/BestFitFileCompat.Wpf -- reference sample-data/RMC-BestFit/examples artifacts/filecompat/wpf --runs 1
          dotnet run -c Release --no-build --project tools/BestFitFileCompat.Wpf -- compare tests/BestFit/RMC.BestFit.FileCompat.Tests/Golden artifacts/filecompat/wpf

      # Exclusions and per-OS limits are documented in the script.
      - name: Upstream portable test suites
        shell: bash
        run: bash scripts/run-upstream-tests.sh

      - name: Probe example projects
        shell: bash
        run: |
          dotnet run --project tools/ProjectProbe/ProjectProbe.csproj -c Release -- sample-data/RMC-BestFit/examples --tables > probe-${{ matrix.name }}.txt
          grep '^#' probe-${{ matrix.name }}.txt

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: probe-${{ matrix.name }}
          path: probe-${{ matrix.name }}.txt
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: filecompat-${{ matrix.name }}
          path: artifacts/filecompat/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        with:
          name: hecdss-${{ matrix.name }}
          path: artifacts/native/runtimes/
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-logs-${{ matrix.name }}
          path: artifacts/logs/
          if-no-files-found: ignore

  compare-probes:
    name: Project files read identically on every OS
    needs: portable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: probe-*
          merge-multiple: true

      - name: Compare fingerprints
        shell: bash
        run: |
          # Drop the per-machine header lines and any CR line endings before comparing.
          for f in probe-*.txt; do tr -d '\r' < "$f" | grep -v '^#' > "${f%.txt}.body"; done
          status=0
          for f in probe-*.body; do
            diff -u probe-windows-x64.body "$f" || status=1
          done
          exit $status
