name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  VSTEST_CONNECTION_TIMEOUT: '600'

jobs:
  portable:
    name: Portable layer (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest }
          - { name: macos-arm64, os: macos-latest }
          - { name: linux-x64, os: ubuntu-latest }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Fetch pinned upstream sources
        shell: bash
        run: bash scripts/fetch-upstream.sh --with-examples

      # Exclusions and per-OS limits are documented in the script.
      - name: Upstream portable test suites
        shell: bash
        run: bash scripts/run-upstream-tests.sh

      - name: Probe example projects
        shell: bash
        run: |
          dotnet run --project tools/ProjectProbe/ProjectProbe.csproj -c Release -- upstream/RMC-BestFit/examples --tables > probe-${{ matrix.name }}.txt
          grep '^#' probe-${{ matrix.name }}.txt

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: probe-${{ matrix.name }}
          path: probe-${{ matrix.name }}.txt
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-logs-${{ matrix.name }}
          path: artifacts/logs/
          if-no-files-found: ignore

  compare-probes:
    name: Project files read identically on every OS
    needs: portable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: probe-*
          merge-multiple: true

      - name: Compare fingerprints
        shell: bash
        run: |
          for f in probe-*.txt; do grep -v '^#' "$f" > "${f%.txt}.body"; done
          status=0
          for f in probe-*.body; do
            diff -u probe-windows-x64.body "$f" || status=1
          done
          exit $status
