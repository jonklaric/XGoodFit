name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  VSTEST_CONNECTION_TIMEOUT: '600'

jobs:
  portable:
    name: Portable layer (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    # The App tests (tests/BestFit/RMC.BestFit.App.Tests) take most of this, the macOS runner longest:
    # 120 minutes until they're made lighter.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # rids: the HEC-DSS natives built on this runner (osx-x64 is cross-built on Apple silicon).
          - { name: windows-x64, os: windows-latest, rids: win-x64 }
          - { name: macos-arm64, os: macos-latest, rids: osx-arm64 osx-x64 }
          - { name: linux-x64, os: ubuntu-latest, rids: linux-x64 }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # BestFit's example projects, and HEC's sample DSS files for the HEC-DSS tests.
      - name: Fetch sample data
        shell: bash
        run: bash scripts/fetch-sample-data.sh RMC-BestFit dss-test-data

      # The native hecdss library from upstream/hec-dss (CMake, C only, no downloads), then HEC's C
      # tests with CTest. The osx-x64 tests run under Rosetta 2 when the runner has it.
      - name: Build HEC-DSS natives and run HEC's C tests
        shell: bash
        run: bash native/build-hecdss.sh --test ${{ matrix.rids }}

      # Everything needed to build is in the repository: no downloads besides NuGet packages.
      - name: Build from a fresh checkout
        run: dotnet build XGoodFit.slnx -c Release

      # The ported UI's own tests, run headlessly, and the HEC-DSS wrapper's tests, which must find
      # the natives and the sample data here. The application's view tests run in the next step.
      - name: XGoodFit tests
        run: dotnet test XGoodFit.slnx -c Release --no-build -p:XGoodFitAppTestsInScript=true
        env:
          XGOODFIT_REQUIRE_HECDSS: '1'

      # The application's view tests (RMC.BestFit.App.Tests), each of XGoodFit's test classes in its
      # own process: in one process they need more memory than the runners have.
      - name: App tests
        if: ${{ !cancelled() }}
        shell: bash
        run: bash scripts/run-app-tests.sh Release

      # Each class's full output, for failures the step's summary doesn't explain.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: app-tests-${{ matrix.name }}
          path: artifacts/logs/app-tests/
          if-no-files-found: ignore

      # The tests above include the file-compatibility suite (tests/BestFit/RMC.BestFit.FileCompat.Tests):
      # every example opened and saved by the port, compared with what upstream's WPF RMC-BestFit saves.
      # This shows what it found here, including the platform differences it accepts outside Windows.
      - name: File-compatibility summary
        if: always()
        shell: bash
        run: cat artifacts/filecompat/*/summary.txt 2>/dev/null || echo "No file-compatibility summary was written."

      # The files the suite saved with the port, beside their descriptions: the examples it opened and
      # saved, and under changed/ the few it changed first. The file-matrix job below opens them with
      # upstream's own WPF RMC-BestFit. About 380 MB, so they are kept for a week only.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: filecompat-saved-${{ matrix.name }}
          path: artifacts/filecompat/**/*.bestfit
          retention-days: 7
          if-no-files-found: ignore

      # Windows only: upstream's own WPF RMC-BestFit opens and saves the examples again, and must write
      # exactly the golden data the suite compares the port with (Golden/README.md in its tests).
      - name: WPF reference matches the golden data
        if: runner.os == 'Windows'
        shell: bash
        run: |
          dotnet run -c Release --project tools/BestFitFileCompat.Wpf -- reference sample-data/RMC-BestFit/examples artifacts/filecompat/wpf --runs 1
          dotnet run -c Release --no-build --project tools/BestFitFileCompat.Wpf -- compare tests/BestFit/RMC.BestFit.FileCompat.Tests/Golden artifacts/filecompat/wpf

      # Exclusions and per-OS limits are documented in the script.
      - name: Upstream portable test suites
        shell: bash
        run: bash scripts/run-upstream-tests.sh

      - name: Probe example projects
        shell: bash
        run: |
          dotnet run --project tools/ProjectProbe/ProjectProbe.csproj -c Release -- sample-data/RMC-BestFit/examples --tables > probe-${{ matrix.name }}.txt
          grep '^#' probe-${{ matrix.name }}.txt

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: probe-${{ matrix.name }}
          path: probe-${{ matrix.name }}.txt
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: filecompat-${{ matrix.name }}
          path: |
            artifacts/filecompat/
            !artifacts/filecompat/**/*.bestfit
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        with:
          name: hecdss-${{ matrix.name }}
          path: artifacts/native/runtimes/
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-logs-${{ matrix.name }}
          path: artifacts/logs/
          if-no-files-found: ignore

  # The end-to-end tests: the example tour (XGoodFit/ExampleTour*Tests.cs, every element of each of
  # RMC-BestFit's 32 example projects opened through the main window, changing nothing) and the
  # walkthroughs (XGoodFit/Walkthrough*Tests.cs, each example's walkthrough followed step by step). A job
  # of its own, so it runs beside the portable layer. Its screenshots show each OS's rendering of every view.
  example-tour:
    name: Examples end to end (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest, rids: win-x64 }
          - { name: macos-arm64, os: macos-latest, rids: osx-arm64 }
          - { name: linux-x64, os: ubuntu-latest, rids: linux-x64 }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Fetch sample data
        shell: bash
        run: bash scripts/fetch-sample-data.sh RMC-BestFit

      # The HEC-DSS example's time series come from its DSS file.
      - name: Build HEC-DSS natives
        shell: bash
        run: bash native/build-hecdss.sh ${{ matrix.rids }}

      - name: Build the application's tests
        run: dotnet build tests/BestFit/RMC.BestFit.App.Tests -c Release

      - name: Example tour and walkthroughs
        shell: bash
        run: bash scripts/run-app-tests.sh Release Tour Walkthroughs

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: example-tour-${{ matrix.name }}
          path: |
            artifacts/screenshots/examples/
            artifacts/logs/app-tests/
          if-no-files-found: ignore

  # The bidirectional file matrix (docs/migration-plan.md, Phase 9): upstream's own WPF RMC-BestFit opens
  # the files the port saved on each OS, saves them again and opens that save, and each step must give
  # what it gives with its own saves of the examples (the golden data) or, for the files the port changed
  # first, the state the port opens them to. Files from Windows must match exactly; from macOS and Linux
  # the platform differences are accepted and reported, among them whether RMC-BestFit writes them back.
  # tools/BestFitFileCompat.Wpf's open-saved command; Golden/README.md in the file-compatibility tests.
  file-matrix:
    name: RMC-BestFit opens the port's files from every OS
    needs: portable
    # A portable job can fail for reasons of its own (the App tests, say): open the files it did save.
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Each OS's saved files, and the descriptions and states the suite wrote beside them.
      - uses: actions/download-artifact@v8
        with:
          pattern: filecompat-*
          path: artifacts/filecompat-ci
          merge-multiple: true

      # Only upstream's WPF RMC.BestFit.UI and what it builds on. No sample data (the golden data describes
      # RMC-BestFit's saves of the examples) and no HEC-DSS natives (opening and saving never read DSS files).
      - name: Build upstream's WPF RMC-BestFit
        run: dotnet build tools/BestFitFileCompat.Wpf -c Release

      - name: RMC-BestFit opens, saves and reopens the port's files
        shell: bash
        run: |
          status=0
          for rid in win-x64 linux-x64 osx-arm64; do
            if [ ! -d "artifacts/filecompat-ci/$rid" ]; then
              echo "::error::No files the port saved on $rid: see that OS's Portable layer job."
              status=1
              continue
            fi
            dotnet run -c Release --no-build --project tools/BestFitFileCompat.Wpf -- open-saved "artifacts/filecompat-ci/$rid" \
              tests/BestFit/RMC.BestFit.FileCompat.Tests/Golden "artifacts/filecompat-matrix/$rid" || status=1
          done
          exit $status

      - name: File matrix summary
        if: always()
        shell: bash
        run: |
          {
            echo '### RMC-BestFit opens the files the port saved'
            echo '```'
            grep -h '^#' artifacts/filecompat-matrix/*/summary.txt 2>/dev/null || echo "No summary was written."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Named apart from the filecompat-* artifacts, which a re-run of this job downloads again.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: file-matrix
          path: artifacts/filecompat-matrix/
          if-no-files-found: ignore

  compare-probes:
    name: Project files read identically on every OS
    needs: portable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: probe-*
          merge-multiple: true

      - name: Compare fingerprints
        shell: bash
        run: |
          # Drop the per-machine header lines and any CR line endings before comparing.
          for f in probe-*.txt; do tr -d '\r' < "$f" | grep -v '^#' > "${f%.txt}.body"; done
          status=0
          for f in probe-*.body; do
            diff -u probe-windows-x64.body "$f" || status=1
          done
          exit $status
