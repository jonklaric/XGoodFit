name: Package

# XGoodFit's installable, self-updating packages, made with Velopack (decision D7): see
# packaging/README.md. Run it by hand to get the packages as artifacts; a version tag (vX.Y.Z, which
# must match Version in Directory.Build.props) also drafts a GitHub release with them, for a
# maintainer to review and publish. Published releases are the update feed.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  package:
    name: Package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest, rids: win-x64 }
          # macOS packages must be made on macOS: the Apple silicon runner makes both (osx-x64 is cross-built).
          - { name: macos, os: macos-latest, rids: osx-arm64 osx-x64 }
          # The oldest Ubuntu runner: the HEC-DSS library needs the glibc it's built with or later (native/README.md).
          - { name: linux-x64, os: ubuntu-22.04, rids: linux-x64 }
    env:
      # Apple signing and notarization run only when these secrets exist (packaging/README.md).
      HAS_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(dotnet msbuild src/BestFit/RMC.BestFit.App/RMC.BestFit.App.csproj -getProperty:Version | tr -d '\r')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match Version $version in Directory.Build.props."
            exit 1
          fi

      - name: Install the AppImage tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools desktop-file-utils

      # The previous release's full package for each runtime, from which vpk makes a delta package.
      # There's none before the first release (or for a runtime that's new in this one).
      - name: Download the previous release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dotnet tool restore
          for rid in ${{ matrix.rids }}; do
            dotnet vpk download github --repoUrl "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --token "$GH_TOKEN" --pre \
              --channel "$rid" --outputDir "artifacts/previous/$rid" --skip-updates ||
              echo "::warning::No previous release for $rid could be downloaded, so there's no delta package."
          done

      # Imports the Developer ID certificates into a temporary keychain, and stores the notary
      # credentials there, for scripts/package.sh to sign, notarize and staple with.
      - name: Set up Developer ID signing
        if: runner.os == 'macOS' && env.HAS_DEVELOPER_ID == 'true'
        shell: bash
        env:
          APPLE_DEVELOPER_ID_CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/xgoodfit-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$APPLE_DEVELOPER_ID_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/pkgbuild
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          app_identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: .*\)"$/\1/p' | head -n 1)"
          installer_identity="$(security find-identity -v "$keychain" | sed -n 's/.*"\(Developer ID Installer: .*\)"$/\1/p' | head -n 1)"
          if [ -z "$app_identity" ]; then
            echo "::error::APPLE_DEVELOPER_ID_CERTIFICATE has no Developer ID Application certificate."
            exit 1
          fi
          {
            echo "XGF_MAC_KEYCHAIN=$keychain"
            echo "XGF_MAC_SIGN_APP_IDENTITY=$app_identity"
            if [ -n "$installer_identity" ]; then echo "XGF_MAC_SIGN_INSTALL_IDENTITY=$installer_identity"; fi
          } >> "$GITHUB_ENV"
          if [ -z "$installer_identity" ]; then
            echo "::warning::APPLE_DEVELOPER_ID_CERTIFICATE has no Developer ID Installer certificate, so the .pkg isn't signed."
          fi

          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_TEAM_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ]; then
            xcrun notarytool store-credentials xgoodfit-notary --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" --keychain "$keychain"
            echo "XGF_MAC_NOTARY_PROFILE=xgoodfit-notary" >> "$GITHUB_ENV"
          else
            echo "::warning::APPLE_ID, APPLE_TEAM_ID or APPLE_APP_SPECIFIC_PASSWORD is missing, so the packages aren't notarized."
          fi

      # Builds the HEC-DSS natives, publishes the application and packs it, for each runtime.
      - name: Build the packages
        shell: bash
        run: bash scripts/package.sh --delta-from artifacts/previous ${{ matrix.rids }}

      # Their structure and signature, and the packaged application started headlessly.
      - name: Check the packages
        shell: bash
        run: bash scripts/check-package.sh ${{ matrix.rids }}

      - name: Remove the signing keychain
        if: always() && runner.os == 'macOS' && env.XGF_MAC_KEYCHAIN != ''
        shell: bash
        run: security delete-keychain "$XGF_MAC_KEYCHAIN"

      - uses: actions/upload-artifact@v7
        with:
          name: xgoodfit-${{ matrix.name }}
          path: artifacts/packages/
          if-no-files-found: error

  release:
    name: Draft the GitHub release
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/download-artifact@v8
        with:
          pattern: xgoodfit-*
          path: artifacts/packages
          merge-multiple: true

      # One draft release for the tag, with each runtime's Velopack release files (its packages,
      # installers and releases.<rid>.json, the update feed), then the Linux tarball.
      - name: Upload the packages to a draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dotnet tool restore
          version="${GITHUB_REF_NAME#v}"
          prerelease=""
          case "$version" in *-*) prerelease="--pre" ;; esac
          for dir in artifacts/packages/*/; do
            rid="$(basename "$dir")"
            # $prerelease is empty or one word, so word splitting is wanted.
            dotnet vpk "[${rid%%-*}]" upload github --repoUrl "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --token "$GH_TOKEN" \
              --channel "$rid" --outputDir "$dir" --tag "$GITHUB_REF_NAME" --targetCommitish "$GITHUB_SHA" \
              --releaseName "XGoodFit $version" --merge $prerelease --skip-updates
          done
          gh release upload "$GITHUB_REF_NAME" artifacts/packages/*/*.tar.gz --repo "$GITHUB_REPOSITORY"
