# Pinned upstream sources, fetched into upstream/<name> by scripts/fetch-upstream.sh.
# Bumping a pin is a deliberate change: update the commit here, then port the upstream
# delta to the mirrored files (docs/migration-plan.md §10).
#
# Columns: name  git-url  commit  sparse-paths  optional-paths
#   sparse-paths    comma-separated folders to check out ('*' = whole tree, '-' = only with
#                   --with-examples); root files are always included
#   optional-paths  extra folders fetched only with --with-examples ('*' = whole tree, '-' = none)
#
# HEC-DSS: hec-dss is release 7-JA-7, the newest release, which builds with CMake and no Fortran.
# Five functions declared by hec-dss-dotnet 2.0.3 (written for 7-IU-6) have since gained trailing
# parameters, so the wrapper is compiled with corrected declarations (docs/migration-plan.md §7).
# zlib is v1.3.1, the version hec-dss 7-JA-7 builds with. dss-test-data is the sample data for
# HEC's own C and .NET tests.
