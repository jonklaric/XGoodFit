# Upstream source code vendored into upstream/<name> by scripts/vendor-upstream.sh.
# Each folder is a byte-for-byte copy of the pinned commit, never edited by hand.
# upstream/README.md cites each source repository with its version and licence.
# Bumping a pin is a deliberate change (docs/migration-plan.md §10): update the commit here, run
# scripts/vendor-upstream.sh <name>, review the staged diff, and port the upstream changes.
#
# Columns: name  git-url  commit  folders  excluded
#   folders   comma-separated folders to copy ('*' = whole tree); root files are always copied
#   excluded  comma-separated paths left out, relative to the repository root, where '*' also
#             matches '/' ('-' = none)
#
# - Numerics: tag v2.2.0, the exact source of the RMC.Numerics 2.2.0 NuGet package that RMC-BestFit
#   2.0.1 uses (the package records this commit). Left out: instructions for AI coding agents.
# - hec-dss: tag 7-JA-7, the newest release, which builds with CMake and needs no Fortran. Five
#   functions declared by hec-dss-dotnet 2.0.3 (written for 7-IU-6) have since gained trailing
#   parameters, so the wrapper is compiled with corrected declarations (docs/migration-plan.md §7).
#   Left out: a prebuilt tool and the Visual Studio solution and project files of HEC's old
#   Windows build, which CMake replaces.
# - zlib: tag v1.3.1, the version hec-dss 7-JA-7 builds with. Left out: the optional contrib/ extras.
